<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalpvriksy Restaurant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#fffaf5;
    color:#333;
}

header{
    background:#8B0000;
    color:#fff;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
    gap:25px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    font-weight:500;
    transition:.3s;
}

nav ul li a:hover{
    color:#FFD700;
}

.hero{
    height:90vh;
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url('restaurant.jpg') center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero-content h1{
    font-size:50px;
    margin-bottom:15px;
}

.hero-content p{
    font-size:20px;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    background:#FFD700;
    color:#000;
    padding:14px 28px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.3s;
}

.btn:hover{
    background:white;
}
</style>
</head>

<body>

<header>

<div class="logo">
Kalpvriksy Restaurant
</div>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#menu">Menu</a></li>
<li><a href="#about">About</a></li>
<li><a href="#gallery">Gallery</a></li>
<li><a href="#contact">Contact</a></li>
</ul>
</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1>Welcome to Kalpvriksy Restaurant</h1>

<p>Fresh Food • Great Taste • Happy Moments</p>

<a href="#menu" class="btn">
Explore Menu
</a>

</div>

  </section>
